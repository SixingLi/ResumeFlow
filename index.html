<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ResumeFlow">
<link rel="manifest" href="manifest.json">
<title>ResumeFlow V1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">ResumeFlow <span>V1</span></div>
  <div class="save" id="saveState">本地自动保存</div>
  <div class="spacer"></div>
  <button id="demoBtn">加载示例</button>
  <button class="primary" id="pdfBtn">导出 PDF</button>
</header>

<div class="main">
<aside class="left">
  <h3>① 导入简历</h3>
  <div class="drop" id="drop">
    <strong>拖入 TXT / MD / JSON</strong><br>
    <span class="hint">也可以直接粘贴简历内容</span><br><br>
    <input id="file" type="file" accept=".txt,.md,.json,text/plain,application/json" hidden>
    <button id="fileBtn">选择文件</button>
  </div>

  <textarea id="source" placeholder="把我给你的定向简历粘贴到这里……"></textarea>
  <div class="actions">
    <button id="renderBtn">生成预览</button>
    <button id="clearBtn">清空</button>
  </div>
  <div class="footer-note">
    V1：文本 → 自动识别 → 模板渲染。简历内容只保存在本机浏览器。
  </div>
</aside>

<main class="center">
  <div id="paper" class="paper"></div>
</main>

<aside class="right">
  <h3>② 选择模板</h3>
  <div class="template">
    <button class="active" data-t="classic">技术专业</button>
    <button data-t="modern">大厂简洁</button>
    <button data-t="sidebar">左右栏</button>
    <button data-t="executive">高级商务</button>
  </div>

  <h3>③ 版式</h3>
  <div class="control">
    <label>字体</label>
    <select id="font">
      <option value="pingfang">苹方 / PingFang SC</option>
      <option value="yahei">微软雅黑</option>
      <option value="system">系统默认</option>
    </select>
  </div>
  <div class="control">
    <label>正文大小</label>
    <div class="range">
      <input id="size" type="range" min="10" max="15" step=".5" value="13">
      <span id="sizeVal">13</span>
    </div>
  </div>
  <div class="control">
    <label>预览缩放</label>
    <div class="range">
      <input id="zoom" type="range" min=".55" max="1" step=".05" value=".8">
      <span id="zoomVal">80%</span>
    </div>
  </div>
  <div class="hint">PDF 导出时会恢复 A4 原始比例。</div>
</aside>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
